# CromDB Server with Docker Compose. The guide is README.md, beside this file.
#
#   cp .env.example .env      then fill in .env
#   docker compose up -d
#   docker compose logs -f
#
# The login provider (Keycloak, say) is not in this file: run it on its own.

services:
  cromdb:
    image: ghcr.io/skaife/cromdb-server:${CROMDB_VERSION:-latest}
    # The admin UI's Restart button exits the server, and this starts it
    # again. "on-failure" and "no" would leave it stopped.
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - cromdb-data:/data
      # For HTTPS in the server: a folder with the certificate and key.
      # - ./certs:/certs:ro
    # A maintenance run in progress is finished before the server stops.
    stop_grace_period: 60s
    # For the client secret from a file instead of .env: uncomment these and
    # the secrets section below, and set CROMDB_CLIENT_SECRET_FILE in .env.
    # secrets:
    #   - client_secret

# secrets:
#   client_secret:
#     file: ./client-secret.txt

volumes:
  cromdb-data:
    # A fixed name, so the backup commands in the guide work whatever this
    # folder is called.
    name: cromdb-data
