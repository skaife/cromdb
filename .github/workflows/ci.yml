name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # The latest Node 24 release, which meets engines (>=24.13.1).
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Installs the packed package into a new project, as a user would get it.
  # better-sqlite3 ships a different native binary for each OS, so this runs
  # on all three.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-package.mjs

  # The demo in demo/: three replica processes syncing over HTTP. It uses the
  # built package through "cromdb", so it runs after the build.
  demo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix demo
      - run: npm run typecheck --prefix demo
      - run: npm test --prefix demo

  # The demo's page in Chromium: both scenes played by clicking, against three
  # real replica processes. Ubuntu only: the page and the browser behave the
  # same everywhere, and the demo job above covers the servers on each OS.
  demo-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix demo
      - run: npx playwright install --with-deps chromium
        working-directory: demo
      - run: npm run test:browser --prefix demo
