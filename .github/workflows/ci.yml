name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # The latest Node 24 release, which meets engines (>=24.13.1).
          node-version: "24"
          cache: npm
      - run: npm ci
      # The driver packages depend on exact workspace versions; a mismatch
      # would quietly install the engine from the registry instead.
      - run: npm run check-pins
      # Before typecheck: the driver packages type-check against the built
      # engine and driver interface.
      - run: npm run build
      - run: npm run typecheck
      # The engine, the driver interface, the level-4 driver with the
      # contract tests, the admin UI's component tests, and the server (its
      # program test runs the build).
      - run: npm test

  # Installs the packed package into a new project, as a user would get it.
  # better-sqlite3 ships a different native binary for each OS, so this runs
  # on all three.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node packages/engine/scripts/check-package.mjs

  # The demo in demo/: three replica processes syncing over HTTP. It uses the
  # built package through "cromdb", so it runs after the build.
  demo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix demo
      - run: npm run typecheck --prefix demo
      - run: npm test --prefix demo

  # Replicas on cromdb 0.2.0, 0.3.0, 0.4.0 and 0.5.0, installed from npm into
  # compat/ (never a dependency of the package), syncing both ways with the
  # current build and with replicas it makes from tickets, each opening
  # database files the other made, and each refusing a later level's data.
  cross-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            compat/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix compat
      - run: npm run typecheck --prefix compat
      - run: npm test --prefix compat

  # The demo's page in Chromium: both scenes played by clicking, against three
  # real replica processes. Ubuntu only: the page and the browser behave the
  # same everywhere, and the demo job above covers the servers on each OS.
  demo-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix demo
      - run: npx playwright install --with-deps chromium
        working-directory: demo
      - run: npm run test:browser --prefix demo

  # The admin UI in Chromium and Firefox, at desktop and phone width, against
  # a real server serving the built page, with the fake login provider: every
  # screen also checked for accessibility (axe), sideways scrolling, CSP
  # violations and console errors. Screenshots of each screen are kept as an
  # artifact. Ubuntu only, like demo-browser: the component tests run in the
  # test job on every OS.
  admin-ui-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
        working-directory: packages/admin-ui
      - run: npm run test:browser -w @cromdb/admin-ui
        env:
          CROMDB_SCREENS: ${{ github.workspace }}/admin-ui-screens
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: admin-ui-screens
          path: |
            admin-ui-screens
            packages/admin-ui/test-results
          if-no-files-found: ignore

  # The server's login scenarios and attack cases against real Keycloak, the
  # pinned image in Docker with the realms in packages/server/test/fixtures,
  # and the check of Keycloak's shapes that keeps the fake provider honest.
  # Ubuntu only: the other runners have no Docker. The test job runs the same
  # scenarios against the fake provider on every OS.
  keycloak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:keycloak
